<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Week 5 Task: Single Page Application (SPA) Simulation featuring History API routing, reactive state management, and smooth view transitions." />
  <title>NexusFlow — SPA Architecture Simulation</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Top Progress Bar for Asynchronous Route Transitions -->
  <div id="route-progress" class="route-progress" role="progressbar" aria-hidden="true"></div>

  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar" aria-label="Main Navigation">
      <div class="sidebar-header">
        <a href="#/dashboard" data-link class="brand-logo">
          <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">NexusFlow</span>
            <span class="brand-badge">SPA Engine v1.0</span>
          </div>
        </a>
        <button id="mobile-menu-close" class="icon-btn mobile-only" aria-label="Close navigation menu">
          ✕
        </button>
      </div>

      <div class="nav-section-label">Main Views</div>
      <nav class="sidebar-nav" role="navigation">
        <a href="#/dashboard" data-link class="nav-link active" data-route="/dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="9" rx="1"></rect>
            <rect x="14" y="3" width="7" height="5" rx="1"></rect>
            <rect x="14" y="12" width="7" height="9" rx="1"></rect>
            <rect x="3" y="16" width="7" height="5" rx="1"></rect>
          </svg>
          <span>Dashboard</span>
        </a>

        <a href="#/projects" data-link class="nav-link" data-route="/projects">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Projects</span>
          <span class="nav-pill" id="nav-project-count">6</span>
        </a>

        <a href="#/tasks" data-link class="nav-link" data-route="/tasks">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
          <span>Task Board</span>
          <span class="nav-pill nav-pill-accent" id="nav-task-count">0</span>
        </a>

        <a href="#/analytics" data-link class="nav-link" data-route="/analytics">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          <span>Analytics</span>
        </a>

        <a href="#/architecture" data-link class="nav-link" data-route="/architecture">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>SPA Telemetry</span>
        </a>
      </nav>

      <div class="nav-section-label">Simulation Controls</div>
      <div class="sidebar-Diagnostics">
        <div class="diag-row">
          <label for="latency-toggle" class="diag-label">
            <span>Simulated Latency</span>
            <small id="latency-value">180ms</small>
          </label>
          <input type="range" id="latency-slider" min="0" max="800" step="20" value="180" aria-label="Simulated network latency in milliseconds" />
        </div>
        <div class="diag-actions">
          <a href="#/non-existent-route-404" data-link class="btn btn-sm btn-outline-danger">
            Test 404 Route
          </a>
          <button type="button" id="simulate-error-btn" class="btn btn-sm btn-outline-warning">
            Test Async Error
          </button>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span>No Page Reloads: <strong id="reload-counter">0</strong></span>
        </div>
        <div class="status-sub">
          Transitions: <strong id="transition-counter">1</strong>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <!-- Top Header Bar -->
      <header class="top-header">
        <div class="header-left">
          <button id="mobile-menu-open" class="icon-btn mobile-only" aria-label="Open navigation menu">
            ☰
          </button>

          <!-- Browser History Navigation Controls -->
          <div class="history-controls" role="group" aria-label="Browser History Controls">
            <button type="button" id="history-back-btn" class="icon-btn" title="History Back (history.back())" aria-label="Go back">
              ←
            </button>
            <button type="button" id="history-forward-btn" class="icon-btn" title="History Forward (history.forward())" aria-label="Go forward">
              →
            </button>
          </div>

          <!-- Simulated Address / Route Bar -->
          <div class="route-bar" title="Current Virtual Route managed by History API">
            <span class="route-protocol">spa://nexusflow</span>
            <span id="current-route-display" class="route-path">/dashboard</span>
            <span id="route-trigger-badge" class="route-badge">INIT</span>
          </div>
        </div>

        <div class="header-right">
          <div class="search-box">
            <input type="search" id="global-search" placeholder="Quick jump (e.g. projects, tasks)..." aria-label="Quick navigation search" />
          </div>

          <button type="button" id="theme-toggle-btn" class="icon-btn" title="Toggle Dark/Light Theme" aria-label="Toggle color theme">
            <span id="theme-icon">☀️</span>
          </button>
        </div>
      </header>

      <!-- Dynamic SPA View Outlet -->
      <main id="app-view" class="view-container" aria-live="polite" tabindex="-1">
        <!-- Dynamic content is injected here by js/router.js without full page reloads -->
        <div class="skeleton-loader">
          <div class="skeleton-header"></div>
          <div class="skeleton-grid">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </div>
      </main>

      <!-- Live History API & State Footer Bar -->
      <footer class="telemetry-bar">
        <div class="telemetry-item">
          <span class="telemetry-label">History API State:</span>
          <code id="history-state-preview">{"route":"/dashboard"}</code>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-label">DOM Render Time:</span>
          <code id="render-time-metric">0.0 ms</code>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-label">Active Store Listeners:</span>
          <code id="store-listeners-metric">1</code>
        </div>
      </footer>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="assertive"></div>

  <!-- Application Scripts -->
  <script src="js/store.js"></script>
  <script src="js/views.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
